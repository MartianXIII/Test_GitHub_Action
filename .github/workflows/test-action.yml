name: Test My JS Action

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run my local JS GitHub Action
        uses: ./test-js-action  # assumes your action.yml is in the root
        with:
          name: Mister Mars
