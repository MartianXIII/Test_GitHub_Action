name: Test Custom JS Action

on: [push]

jobs:
  test-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run custom JS action
        id: greet
        uses: ./test-js-action
        with:
          name: Mister Mars

      - name: Validate output
        run: |
          echo "🕒 Time output from action: ${{ steps.greet.outputs.time }}"
          if [ -z "${{ steps.greet.outputs.time }}" ]; then
            echo "❌ No time output!"
            exit 1
          fi
